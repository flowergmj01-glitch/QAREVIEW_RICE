        function generateInterviewHTML(qData) {
            return `
                <div class="bg-white rounded-2xl shadow-md p-6 mb-6 border-2 border-orange-100">
                    <div class="flex items-start mb-4">
                        <span class="text-3xl mr-3">🎤</span>
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${qData.jp}</h3>
                            <p class="text-gray-500 text-sm mt-1">${qData.cn}</p>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 font-bold mb-2 text-sm">✎ 你的回答 (先自由發揮)：</label>
                        <textarea class="w-full border-2 border-gray-200 rounded-xl p-3 focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 transition" rows="3" placeholder="請在此輸入你的日文回答草稿..."></textarea>
                    </div>

                    <button onclick="toggleHint(this, 'hint-${qData.id}')" class="bg-orange-400 hover:bg-orange-500 text-white font-bold py-2 px-4 rounded-full transition shadow-sm flex items-center">
                        <span class="mr-2">💡</span> 點擊查看參考選項
                    </button>

                    <div id="hint-${qData.id}" class="hidden mt-4 bg-orange-50 rounded-xl p-4 border border-orange-200 fade-in">
                        <p class="text-orange-800 font-bold mb-2">參考說法 (可選擇適合的來修改)：</p>
                        <ul class="list-disc pl-5 space-y-2 text-gray-700">
                            ${qData.hints.map(hint => `<li>${hint}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        function generateQuizHTML(quizData, blockIndex) {
            let questionsHTML = quizData.questions.map((q, qIndex) => {
                let optionsHTML = q.options.map((opt, optIndex) => `
                    <label class="cursor-pointer relative flex-1">
                        <input type="radio" name="quiz_${blockIndex}_${qIndex}" value="${optIndex}" class="peer sr-only">
                        <span class="block text-center py-2 px-4 rounded-lg border-2 border-gray-200 peer-checked:bg-green-100 peer-checked:border-green-500 hover:bg-gray-50 transition text-gray-700 font-medium">
                            ${opt}
                        </span>
                    </label>
                `).join('');

                return `
                    <div class="mb-6 pb-4 border-b border-green-100 last:border-0 last:mb-0 last:pb-0">
                        <p class="font-bold text-lg text-gray-800 mb-3">Q${qIndex + 1}. ${q.jp.replace('（　　）', '<span class="inline-block w-16 border-b-2 border-gray-400 text-center text-green-700"></span>')}</p>
                        <div class="flex flex-col sm:flex-row gap-3 mb-3">
                            ${optionsHTML}
                        </div>
                        <div id="result_${blockIndex}_${qIndex}" class="text-sm mt-2 min-h-[24px]"></div>
                    </div>
                `;
            }).join('');

            return `
                <div class="bg-emerald-50 rounded-2xl shadow-md p-6 mb-10 border-2 border-emerald-200">
                    <div class="flex items-center mb-5 border-b-2 border-emerald-200 pb-2">
                        <span class="text-3xl mr-3">✍️</span>
                        <h3 class="text-2xl font-bold text-emerald-800">${quizData.title}</h3>
                    </div>
                    
                    ${questionsHTML}

                    <div class="mt-6 text-center">
                        <button onclick="checkQuiz(${blockIndex})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-8 rounded-full transition shadow-md text-lg">
                            對答案 ✓
                        </button>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const container = document.getElementById('app-container');
            let htmlContent = '';

            appData.forEach((block, index) => {
                htmlContent += `<div class="mb-8">`;
                htmlContent += generateInterviewHTML(block.q1);
                htmlContent += generateInterviewHTML(block.q2);
                htmlContent += generateQuizHTML(block.quiz, index);
                htmlContent += `</div>`;
            });

            // Add Footer
            htmlContent += `
                <div class="text-center mt-12 text-gray-500 text-sm">
                    <p>✨ 祝 曾桑與溫桑 FOOD TAIPEI 展出大成功！ ✨</p>
                </div>
            `;

            container.innerHTML = htmlContent;
        }

        function toggleHint(btn, targetId) {
            const target = document.getElementById(targetId);
            if (target.classList.contains('hidden')) {
                target.classList.remove('hidden');
                btn.innerHTML = '<span class="mr-2">🔼</span> 隱藏參考選項';
                btn.classList.remove('bg-orange-400', 'hover:bg-orange-500');
                btn.classList.add('bg-gray-400', 'hover:bg-gray-500');
            } else {
                target.classList.add('hidden');
                btn.innerHTML = '<span class="mr-2">💡</span> 點擊查看參考選項';
                btn.classList.remove('bg-gray-400', 'hover:bg-gray-500');
                btn.classList.add('bg-orange-400', 'hover:bg-orange-500');
            }
        }

        function checkQuiz(blockIndex) {
            const quizData = appData[blockIndex].quiz.questions;
            
            quizData.forEach((q, qIndex) => {
                const selected = document.querySelector(`input[name="quiz_${blockIndex}_${qIndex}"]:checked`);
                const resultDiv = document.getElementById(`result_${blockIndex}_${qIndex}`);
                const questionTextContainer = resultDiv.parentElement.querySelector('p span');
                
                if (selected) {
                    const selectedVal = parseInt(selected.value);
                    questionTextContainer.textContent = q.options[selectedVal]; // 填入文字到空格

                    if (selectedVal === q.ans) {
                        resultDiv.innerHTML = `
                            <div class="p-3 bg-green-100 text-green-800 rounded-lg border border-green-300 flex items-start fade-in">
                                <span class="mr-2">✅</span>
                                <div>
                                    <span class="font-bold">正解！</span> 
                                    <p class="text-sm mt-1 text-green-700">${q.exp}</p>
                                </div>
                            </div>`;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="p-3 bg-red-50 text-red-800 rounded-lg border border-red-200 flex items-start fade-in">
                                <span class="mr-2">❌</span>
                                <div>
                                    <span class="font-bold">不對喔～</span> 
                                    <p class="text-sm mt-1 text-red-600">正確答案是：<strong>${q.options[q.ans]}</strong>。因為是「${q.exp}」。</p>
                                </div>
                            </div>`;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <div class="p-2 bg-yellow-50 text-yellow-800 rounded-lg border border-yellow-200 fade-in">
                            ⚠️ 請選擇一個答案喔！
                        </div>`;
                }
            });
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
